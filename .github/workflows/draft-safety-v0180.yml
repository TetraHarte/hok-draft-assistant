name: HoK v0.18.0 draft-safety regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/v0.18.0-draft-safety-dunshan]
permissions:
  contents: read
jobs:
  static-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check app.js
          node --check draft-safety.js
          node --check sw.js
      - name: All repository tests
        run: node --test tests/*.test.cjs
